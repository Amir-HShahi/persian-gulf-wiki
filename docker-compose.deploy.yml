services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: core
      DB_USERNAME: core
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      COOKIE_DOMAIN: persiangulfwiki.ravensandrunes.me
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # This file serves both staging and production. The profile keeps Mailpit out of
    # production entirely: it only starts where COMPOSE_PROFILES=staging is set in
    # /opt/pgw/.env. Deliberately not in app's depends_on — Compose auto-enables a
    # profiled service that something depends on, which would start it in production too.
    profiles:
      - staging
    environment:
      MP_MAX_MESSAGES: 2000
      MP_DATABASE: /data/mailpit.db
    ports:
      # SMTP stays on the compose network only — the app reaches it as mailpit:1025.
      # Publishing it would put an open relay on a public IP. The UI binds to loopback
      # so it's reachable only through the Cloudflare Tunnel, never on the VPS's IP.
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

volumes:
  postgres-data:
  redis-data:
  mailpit-data:

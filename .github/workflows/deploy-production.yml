name: Deploy Production
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # this is what makes GitHub require the manual reviewer approval
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/amir-hshahi/persian-gulf-wiki-core:${{ steps.version.outputs.version }}
            ghcr.io/amir-hshahi/persian-gulf-wiki-core:latest
      # The worker image. A problem building it must not stop the app deploying, so a failure here
      # is not fatal (continue-on-error); the deploy step passes the worker image on only if this
      # succeeded, and the warning below makes the failure visible instead of silent.
      - name: Build and push the worker image
        id: worker
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: submission-pipeline/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/amir-hshahi/persian-gulf-wiki-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/amir-hshahi/persian-gulf-wiki-pipeline:latest
      - name: Warn if the worker image was not built
        if: steps.worker.outcome == 'failure'
        run: echo "::warning title=Worker image::The submission-pipeline image failed to build. The app is deploying without it."
      - name: Install cloudflared
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: Deploy over Cloudflare-tunneled SSH
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/pgw_deploy <<< "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}"
          ssh -i ~/.ssh/pgw_deploy \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.PROD_SSH_HOSTNAME }}" \
              deploy@${{ secrets.PROD_SSH_HOSTNAME }} \
              "cd /opt/pgw && ./deploy.sh ghcr.io/amir-hshahi/persian-gulf-wiki-core:${{ steps.version.outputs.version }} ${{ steps.worker.outcome == 'success' && format('ghcr.io/amir-hshahi/persian-gulf-wiki-pipeline:{0}', steps.version.outputs.version) || '' }}"

name: Deploy Production
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # this is what makes GitHub require the manual reviewer approval
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/amir-hshahi/persian-gulf-wiki-core:${{ steps.version.outputs.version }}
            ghcr.io/amir-hshahi/persian-gulf-wiki-core:latest
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: Deploy over Cloudflare-tunneled SSH
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/pgw_deploy <<< "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}"
          ssh -i ~/.ssh/pgw_deploy \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.PROD_SSH_HOSTNAME }}" \
              deploy@${{ secrets.PROD_SSH_HOSTNAME }} \
              "cd /opt/pgw && ./deploy.sh ghcr.io/amir-hshahi/persian-gulf-wiki-core:${{ steps.version.outputs.version }}"

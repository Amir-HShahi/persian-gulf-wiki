spring:
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,email,profile

app:
  jwt:
    secret: gL9WRJaDuSTEuDJDVZsrqkkUuepIh3/u55JDdevR5eU=
    access-token-ttl-minutes: 15
    access-token-cookie-name: access_token
    refresh-token-ttl-days: 30
    refresh-token-cookie-name: refresh_token
    pending-token-ttl-minutes: 15
  password:
    reset-token-ttl-minutes: 30
  email-verification:
    token-ttl-minutes: 30
  mail:
    frontend-base-url: http://localhost:3000
    from-address: noreply@example.com
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    domain: localhost
  oauth2:
    abandoned-account-ttl-hours: 24
    success-redirect-url: http://localhost:3000/oauth2/success
    pending-password-redirect-url: http://localhost:3000/oauth2/set-password
    failure-redirect-url: http://localhost:3000/oauth2/error
  # endpoint/public-endpoint/access-key/secret-key are supplied by TestcontainersConfiguration
  # from the MinIO container it starts.
  storage:
    region: us-east-1
    staging-bucket: test-staging
    media-bucket: test-media
    public-base-url: http://localhost/test-media/public
    path-style: true
  media:
    job-stream: test-submissions
    result-stream: test-submission-results
    result-consumer-group: core
    result-reclaim-idle-minutes: 5
    result-max-deliveries: 5
    processing-timeout-minutes: 60
    upload-url-ttl-minutes: 10
    signed-get-ttl-minutes: 10
    max-bytes:
      image: 26214400
      panorama: 99614720
      video: 99614720
    reservations-per-window: 30
    reservation-window-minutes: 60
    max-pending-per-user: 20
    storage-quota-bytes-per-user: 2147483648
    metadata-edits-per-window: 20
    metadata-edit-window-minutes: 60
    max-pending-edits-per-user: 20
    abandoned-upload-ttl-hours: 24
    rejected-grace-days: 7
    failed-grace-days: 7
  avatar:
    max-bytes: 5242880
    upload-url-ttl-minutes: 10
    reservations-per-window: 20
    reservation-window-minutes: 60
    abandoned-upload-grace-hours: 1
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # Ingest is off here so no test reaches a real provider; the marinedata tests drive
  # MarineDataIngestService directly with base URLs pointed at a local stub server.
  marine-data:
    ingest-enabled: false
    connect-timeout: 2s
    read-timeout: 5s
    open-meteo-marine:
      base-url: http://127.0.0.1:1
      interval: 1h
      lookback-days: 7
      stations:
        - { key: bushehr, latitude: 28.9, longitude: 50.6 }
        - { key: asaluyeh, latitude: 27.4, longitude: 52.5 }
    open-meteo-air-quality:
      base-url: http://127.0.0.1:1
      interval: 1h
      lookback-days: 7
      stations:
        - { key: asaluyeh, latitude: 27.5, longitude: 52.6 }
    noaa-erddap:
      base-url: http://127.0.0.1:1
      interval: 6h
      lookback-days: 14
      stations:
        - { key: bushehr, latitude: 28.9, longitude: 50.6 }

spring:
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,email,profile

app:
  jwt:
    secret: gL9WRJaDuSTEuDJDVZsrqkkUuepIh3/u55JDdevR5eU=
    access-token-ttl-minutes: 15
    access-token-cookie-name: access_token
    refresh-token-ttl-days: 30
    refresh-token-cookie-name: refresh_token
    pending-token-ttl-minutes: 15
  password:
    reset-token-ttl-minutes: 30
  email-verification:
    token-ttl-minutes: 30
  mail:
    frontend-base-url: http://localhost:3000
    from-address: noreply@example.com
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    domain: localhost
  oauth2:
    abandoned-account-ttl-hours: 24
    success-redirect-url: http://localhost:3000/oauth2/success
    pending-password-redirect-url: http://localhost:3000/oauth2/set-password
    failure-redirect-url: http://localhost:3000/oauth2/error
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

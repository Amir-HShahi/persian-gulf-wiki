email.passwordReset.subject=Password Reset Request
email.passwordReset.body=Dear user,\n\nA request has been made to reset the password for your account on the Persian Gulf Encyclopedia. To proceed, please use the link below:\n\n{0}\n\nThis link is valid for a limited period of time. If you did not make this request, please disregard this email; your account will remain unchanged.
email.verifyEmail.subject=Email Address Verification
email.verifyEmail.body=Dear user,\n\nTo complete your registration and verify the email address associated with your account on the Persian Gulf Encyclopedia, please use the link below:\n\n{0}\n\nThis link is valid for a limited period of time. If you did not make this request, please disregard this email.
email.googleLinked.subject=Google Account Linked
email.googleLinked.body=Dear user,\n\nThis is to inform you that sign-in via Google has been linked to your account on the Persian Gulf Encyclopedia.\n\nIf you did not perform this action, please contact our support team without delay.
email.googleUnlinked.subject=Google Account Unlinked
email.googleUnlinked.body=Dear user,\n\nThis is to inform you that sign-in via Google has been unlinked from your account on the Persian Gulf Encyclopedia.\n\nIf you did not perform this action, please contact our support team without delay.

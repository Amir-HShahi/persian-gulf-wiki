email.passwordReset.subject=Password Reset Request
email.passwordReset.body=Dear user,\n\nA request has been made to reset the password for your account on the Persian Gulf Encyclopedia. To proceed, please use the link below:\n\n{0}\n\nThis link is valid for a limited period of time. If you did not make this request, please disregard this email; your account will remain unchanged.

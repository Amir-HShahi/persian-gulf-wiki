error.duplicateUser.username=اسم المستخدم هذا مُستخدَم بالفعل من قِبل حساب آخر. يُرجى اختيار اسم مستخدم مختلف
error.duplicateUser.generic=اسم المستخدم أو البريد الإلكتروني المُدخل مسجَّل بالفعل في النظام

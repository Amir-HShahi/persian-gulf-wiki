error.invalidCredentials=البريد الإلكتروني أو كلمة المرور المُدخلة غير صحيحة. يُرجى مراجعة البيانات والمحاولة مجدداً
error.invalidRefreshToken=انتهت صلاحية جلستكم الحالية. يُرجى تسجيل الدخول مجدداً للمتابعة
error.accountDisabled=تم تعطيل هذا الحساب ولا يمكن استخدامه لتسجيل الدخول. في حال وجود أي استفسار، يُرجى التواصل مع فريق الدعم
error.invalidPasswordResetToken=رابط إعادة تعيين كلمة المرور غير صالح؛ قد يكون منتهي الصلاحية أو تم استخدامه مسبقاً. يُرجى تقديم طلب جديد
error.invalidEmailVerificationToken=رابط تأكيد البريد الإلكتروني غير صالح أو منتهي الصلاحية. يمكن طلب رابط جديد عند الحاجة
error.duplicateUser.email=يوجد حساب آخر مسجَّل مسبقاً بهذا البريد الإلكتروني
error.duplicateUser.username=اسم المستخدم هذا مُستخدَم بالفعل من قِبل حساب آخر. يُرجى اختيار اسم مستخدم مختلف
error.duplicateUser.generic=اسم المستخدم أو البريد الإلكتروني المُدخل مسجَّل بالفعل في النظام
error.passwordAlreadySet=تم بالفعل تعيين كلمة مرور لهذا الحساب
error.userNotFound=تعذر العثور على مستخدم بهذه المواصفات
error.sessionNotFound=تعذر العثور على الجلسة المطلوبة
error.sessionAlreadyRevoked=تم إبطال هذه الجلسة مسبقاً ولم تعد فعّالة
error.lastAdmin=هذا المستخدم هو المدير الوحيد المتبقي في النظام، ولا يمكن حذفه. يُرجى تعيين مدير آخر قبل المتابعة
error.roleAlreadyGranted=تم منح هذا الدور لهذا المستخدم مسبقاً
error.roleNotGranted=لم يتم منح هذا الدور لهذا المستخدم، وبالتالي لا يمكن إلغاؤه
error.applicationNotFound=تعذر العثور على طلب بهذه المواصفات
error.duplicatePendingApplication=يوجد بالفعل طلب قيد المراجعة لهذا النوع من الكيانات. يُرجى الانتظار حتى صدور القرار قبل تقديم طلب جديد
error.applicationAlreadyReviewed=تمت مراجعة هذا الطلب مسبقاً وتم تسجيل القرار الخاص به
error.invalidPagingParameters=رقم الصفحة أو حجمها غير صالح
error.invalidApplicationStatus=الحالة المحددة لهذا الطلب غير صالحة
error.validationFailed=البيانات المُرسَلة لا تتوافق مع متطلبات النظام. يُرجى تصحيح الأخطاء الواردة أدناه وإعادة الإرسال
error.accessDenied=لا تملكون صلاحية الوصول إلى هذا القسم
error.internal=حدث خطأ غير متوقع في النظام. تم إبلاغ الفريق الفني بالمشكلة؛ يُرجى المحاولة مرة أخرى لاحقاً


media.failure.uploadMissing=لم يتم استلام أي ملف لعنصر الوسائط هذا. يُرجى رفع الملف مرة أخرى
media.failure.uploadMismatch=حجم الملف المستلم أو محتواه لا يطابق المواصفات المُعلنة. يُرجى رفع الملف مرة أخرى
media.failure.duplicate=تمت إضافة هذا الملف مسبقاً إلى معرض هذه المقالة
media.failure.processingError=حدث خطأ أثناء معالجة هذا الملف. يُرجى رفعه مرة أخرى، والتواصل مع الدعم الفني إذا تكررت المشكلة
media.failure.processingTimeout=لم تكتمل معالجة هذا الملف في الوقت المحدد. يُرجى رفعه مرة أخرى
media.failure.rejected=لم يُقبل هذا الملف أثناء المعالجة. يُرجى رفع ملف آخر
media.failure.unsupportedFormat=محتوى هذا الملف ليس بأيٍّ من الصيغ المسموح بها لهذا النوع من الوسائط. يُرجى اختيار ملف بإحدى الصيغ المسموح بها
media.failure.corruptFile=هذا الملف تالف أو تتعذر قراءته. يُرجى رفع ملف سليم
media.failure.dimensionsTooLarge=أبعاد هذه الصورة تتجاوز الحد المسموح به. يُرجى رفع صورة بأبعاد أصغر
media.failure.checksumMismatch=الملف المستلم ليس هو الملف الذي تم الإعلان عنه. يُرجى رفع الملف مرة أخرى
media.failure.panoramaAspectRatio=يجب أن يكون عرض الصورة بزاوية 360 درجة ضعف ارتفاعها تماماً. يُرجى رفع صورة بانورامية كاملة

email.passwordReset.subject=طلب إعادة تعيين كلمة المرور
email.passwordReset.body=تحية طيبة،\n\nوردنا طلب لإعادة تعيين كلمة مرور حسابكم في موسوعة الخليج الفارسي. للمتابعة، يُرجى استخدام الرابط أدناه:\n\n{0}\n\nهذا الرابط صالح لفترة محدودة فقط. إذا لم تكونوا من قدّم هذا الطلب، يُرجى تجاهل هذه الرسالة؛ حسابكم لن يتأثر بذلك.
email.verifyEmail.subject=تأكيد البريد الإلكتروني
email.verifyEmail.body=تحية طيبة،\n\nلإتمام عملية التسجيل وتأكيد البريد الإلكتروني المرتبط بحسابكم في موسوعة الخليج الفارسي، يُرجى استخدام الرابط أدناه:\n\n{0}\n\nهذا الرابط صالح لفترة محدودة فقط. إذا لم تكونوا من قدّم هذا الطلب، يُرجى تجاهل هذه الرسالة.
email.googleLinked.subject=تم ربط حساب جوجل
email.googleLinked.body=تحية طيبة،\n\nنود إعلامكم بأنه تم ربط تسجيل الدخول عبر جوجل بحسابكم في موسوعة الخليج الفارسي.\n\nإذا لم تكونوا من قام بهذا الإجراء، يُرجى التواصل مع فريق الدعم دون تأخير.
email.googleUnlinked.subject=تم فصل حساب جوجل
email.googleUnlinked.body=تحية طيبة،\n\nنود إعلامكم بأنه تم فصل تسجيل الدخول عبر جوجل عن حسابكم في موسوعة الخليج الفارسي.\n\nإذا لم تكونوا من قام بهذا الإجراء، يُرجى التواصل مع فريق الدعم دون تأخير.

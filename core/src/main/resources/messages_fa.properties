error.invalidCredentials=ایمیل یا رمز عبور واردشده صحیح نیست. لطفاً اطلاعات را بررسی و مجدداً اقدام فرمایید
error.invalidRefreshToken=اعتبار نشست کاربری شما به پایان رسیده است. برای ادامه، لازم است مجدداً وارد حساب کاربری خود شوید
error.accountDisabled=این حساب کاربری غیرفعال شده و امکان ورود با آن وجود ندارد. در صورت وجود ابهام، با پشتیبانی سامانه تماس بگیرید
error.invalidPasswordResetToken=پیوند بازنشانی رمز عبور معتبر نیست؛ ممکن است منقضی شده یا پیش‌تر استفاده شده باشد. برای ادامه، درخواست جدیدی ثبت فرمایید
error.invalidEmailVerificationToken=پیوند تأیید ایمیل معتبر نیست یا منقضی شده است. در صورت نیاز، امکان ارسال مجدد آن وجود دارد
error.duplicateUser.email=حساب کاربری دیگری پیش‌تر با این آدرس ایمیل در سامانه ثبت شده است
error.duplicateUser.username=این نام کاربری پیش‌تر توسط کاربر دیگری در سامانه ثبت شده است؛ لطفاً نام دیگری انتخاب فرمایید
error.duplicateUser.generic=نام کاربری یا ایمیل واردشده پیش‌تر در سامانه ثبت شده است
error.passwordAlreadySet=برای این حساب کاربری، رمز عبور از پیش تعیین شده است
error.userNotFound=کاربری با این مشخصات در سامانه یافت نشد
error.sessionNotFound=نشست موردنظر در سامانه یافت نشد
error.sessionAlreadyRevoked=این نشست پیش‌تر باطل شده و دیگر معتبر نیست
error.lastAdmin=این کاربر تنها مدیر باقی‌مانده سامانه است و امکان حذف آن وجود ندارد. پیش از اقدام به حذف، لازم است مدیر دیگری تعیین شود
error.roleAlreadyGranted=این نقش پیش‌تر به کاربر اعطا شده است
error.roleNotGranted=این نقش به کاربر اعطا نشده و امکان لغو آن وجود ندارد
error.applicationNotFound=درخواستی با این مشخصات یافت نشد
error.duplicatePendingApplication=درخواستی برای این نوع موجودیت هم‌اکنون در انتظار بررسی است. لطفاً تا اعلام نتیجه صبر فرمایید
error.applicationAlreadyReviewed=این درخواست پیش‌تر بررسی شده و نتیجه آن ثبت گردیده است
error.invalidPagingParameters=شماره صفحه یا تعداد آیتم‌های درخواستی معتبر نیست
error.invalidApplicationStatus=وضعیت انتخاب‌شده برای این درخواست معتبر نیست
error.validationFailed=اطلاعات ارسالی مطابق ضوابط سامانه نیست. لطفاً موارد زیر را اصلاح و مجدداً ارسال فرمایید
error.accessDenied=دسترسی به این بخش برای شما مجاز نیست
error.internal=خطای غیرمنتظره‌ای در سامانه رخ داده است. این موضوع به تیم فنی گزارش شده است؛ لطفاً پس از مدتی مجدداً تلاش فرمایید


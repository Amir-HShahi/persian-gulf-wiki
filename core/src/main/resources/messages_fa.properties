media.failure.uploadMissing=فایلی برای این رسانه دریافت نشد. لطفاً فایل را مجدداً بارگذاری فرمایید
media.failure.uploadMismatch=حجم یا محتوای فایل دریافت‌شده با مشخصات اعلام‌شده مطابقت ندارد. لطفاً فایل را مجدداً بارگذاری فرمایید

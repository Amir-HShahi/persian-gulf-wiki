media.failure.checksumMismatch=محتوای فایل دریافت‌شده با فایلی که اعلام شده بود یکسان نیست. لطفاً فایل را مجدداً بارگذاری فرمایید
media.failure.panoramaAspectRatio=عرض تصویر ۳۶۰ درجه باید دقیقاً دو برابر ارتفاع آن باشد. لطفاً یک تصویر پانورامای کامل بارگذاری فرمایید

email.passwordReset.subject=درخواست بازنشانی رمز عبور
email.passwordReset.body=با احترام،\n\nدرخواستی جهت بازنشانی رمز عبور حساب کاربری شما در دانشنامه خلیج فارس ثبت شده است. برای انجام این کار، از پیوند زیر استفاده فرمایید:\n\n{0}\n\nاعتبار این پیوند محدود به مدت‌زمان کوتاهی است. چنانچه این درخواست توسط شما ثبت نشده است، این ایمیل را نادیده بگیرید؛ حساب کاربری شما بدون تغییر باقی خواهد ماند.
email.verifyEmail.subject=تأیید آدرس ایمیل
email.verifyEmail.body=با احترام،\n\nجهت تکمیل فرآیند ثبت‌نام و تأیید آدرس ایمیل حساب کاربری شما در دانشنامه خلیج فارس، لطفاً از پیوند زیر استفاده فرمایید:\n\n{0}\n\nاعتبار این پیوند محدود به مدت‌زمان کوتاهی است. چنانچه این درخواست توسط شما ثبت نشده است، این ایمیل را نادیده بگیرید.
email.googleLinked.subject=اتصال حساب گوگل
email.googleLinked.body=با احترام،\n\nبدین‌وسیله اطلاع داده می‌شود که امکان ورود از طریق حساب گوگل به حساب کاربری شما در دانشنامه خلیج فارس متصل شده است.\n\nچنانچه این اقدام توسط شما انجام نشده است، لطفاً بدون تأخیر با تیم پشتیبانی تماس حاصل فرمایید.
email.googleUnlinked.subject=قطع اتصال حساب گوگل
email.googleUnlinked.body=با احترام،\n\nبدین‌وسیله اطلاع داده می‌شود که اتصال ورود از طریق حساب گوگل از حساب کاربری شما در دانشنامه خلیج فارس قطع شده است.\n\nچنانچه این اقدام توسط شما انجام نشده است، لطفاً بدون تأخیر با تیم پشتیبانی تماس حاصل فرمایید.
